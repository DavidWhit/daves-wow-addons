<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>daves_castbar preview</title>
<style>
	:root { --text: #e8e6e1; --muted: #9a978f; --accent: #d4a94e; --panel: rgba(0,0,0,.45); }
	* { box-sizing: border-box; }
	body { margin: 0; color: var(--text); font: 14px/1.4 "Segoe UI", system-ui, sans-serif; min-height: 100vh; background: #101114; }
	body.bg-dark  { background: radial-gradient(ellipse at 30% 20%, #2a2f3a, #0e0f12 70%); }
	body.bg-stone { background: repeating-linear-gradient(90deg, #4a4540 0 3px, #3e3a36 3px 7px), #444; background-blend-mode: overlay; }
	body.bg-grass { background: radial-gradient(ellipse at 50% 0%, #6f8f4a, #2f4a22 75%); }
	body.bg-snow  { background: radial-gradient(ellipse at 50% 10%, #f1f5fb, #9fb1c7 80%); }
	header { position: sticky; top: 0; z-index: 2; display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; padding: 12px 20px; background: var(--panel); backdrop-filter: blur(6px); }
	h1 { font-size: 15px; margin: 0 8px 0 0; color: var(--accent); letter-spacing: .02em; }
	label { display: flex; gap: 6px; align-items: center; color: var(--muted); white-space: nowrap; }
	input[type=range] { width: 110px; }
	select, button { background: #262830; color: var(--text); border: 1px solid #444; border-radius: 4px; padding: 3px 8px; font: inherit; }
	button:hover { border-color: var(--accent); }
	main { padding: 26px 20px 40px; display: grid; gap: 6px; justify-content: start; }
	.row { display: grid; grid-template-columns: 80px auto; align-items: center; gap: 10px; }
	.row .name { color: var(--muted); text-transform: capitalize; text-shadow: 0 1px 2px #000; }
	body.bg-snow .row .name { color: #334; text-shadow: none; }
	canvas { display: block; }
	footer { padding: 0 20px 30px; color: var(--muted); max-width: 760px; }
</style>
</head>
<body class="bg-dark">
<header>
	<h1>daves_castbar</h1>
	<label>Style <select id="style"><option value="framed">Framed</option><option value="borderless">Borderless</option></select></label>
	<label>Corners <select id="corners"><option value="square">Square</option><option value="soft" selected>Soft</option><option value="rounded">Rounded</option></select></label>
	<label>Depth <select id="depth"><option value="flat">Flat</option><option value="bevel">Bevel</option></select></label>
	<label>Width <input id="w" type="range" min="160" max="560" value="320"></label>
	<label>Height <input id="h" type="range" min="14" max="56" value="28"></label>
	<label>Speed <input id="speed" type="range" min="0.25" max="2" step="0.05" value="1"></label>
	<label>Mode <select id="mode"><option value="cast">Cast</option><option value="channel">Channel</option></select></label>
	<label><input id="freeze" type="checkbox"> Hold at <input id="hold" type="range" min="0" max="100" value="70"></label>
	<label>Backdrop <select id="bg"><option value="dark">Dark</option><option value="stone">Stone</option><option value="grass">Grass</option><option value="snow">Snow</option></select></label>
	<button id="interrupt">Interrupt</button>
</header>
<main id="bars"></main>
<footer>Every cast gets fresh random values: the vines take a new path, glyphs and stars appear in new places, and the layer speeds drift on unrelated cycles, so no two casts look the same.</footer>

<script>
const TEX = /*TEXTURES*/{};

const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp01 = v => v < 0 ? 0 : v > 1 ? 1 : v;
const rgba = (c, a) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;
const easeOutBack = t => { const c = 1.7; t -= 1; return 1 + t * t * ((c + 1) * t + c); };

// A smooth random signal (-1..1): three sines with unrelated random periods, so it never visibly loops.
function wobble(scale = 1) {
	const f = [rand(.07, .12), rand(.17, .26), rand(.37, .53)].map(v => v * scale), p = f.map(() => rand(0, 6.283));
	return t => Math.sin(t * f[0] * 6.283 + p[0]) * .5 + Math.sin(t * f[1] * 6.283 + p[1]) * .3 + Math.sin(t * f[2] * 6.283 + p[2]) * .2;
}

const imgs = {};
function loadAll() {
	return Promise.all(Object.entries(TEX).map(([k, src]) => new Promise(res => {
		const i = new Image(); i.onload = () => { imgs[k] = i; res(); }; i.src = src;
	})));
}

// Tinted copies of white sprites, cached (WoW does the same with SetVertexColor).
const tintCache = {};
function tinted(key, c) {
	const id = key + c.join(',');
	if (tintCache[id]) return tintCache[id];
	const img = imgs[key], cv = document.createElement('canvas');
	cv.width = img.width; cv.height = img.height;
	const g = cv.getContext('2d');
	g.drawImage(img, 0, 0);
	g.globalCompositeOperation = 'multiply'; g.fillStyle = rgba(c, 1); g.fillRect(0, 0, cv.width, cv.height);
	g.globalCompositeOperation = 'destination-in'; g.drawImage(img, 0, 0);
	return tintCache[id] = cv;
}

// Heat colours, as Effects.lua IRON_HEAT / MELT_HEAT ([heat, r, g, b]); heatRGB returns 0..1.
const IRON_HEAT = [[0, 42, 34, 32], [.22, 104, 20, 10], [.45, 190, 46, 12], [.66, 245, 118, 28], [.85, 255, 196, 84], [1.05, 255, 246, 214], [1.3, 255, 255, 250]];
const MELT_HEAT = [[0, 52, 50, 56], [.16, 84, 38, 26], [.34, 165, 42, 14], [.52, 228, 92, 18], [.72, 255, 160, 44], [.88, 255, 208, 104], [1, 255, 228, 150]];
function heatRGB(ramp, t) {
	if (t <= ramp[0][0]) return ramp[0].slice(1).map(v => v / 255);
	for (let i = 1; i < ramp.length; i++) if (t <= ramp[i][0]) {
		const a = ramp[i - 1], b = ramp[i], k = (t - a[0]) / (b[0] - a[0]);
		return [1, 2, 3].map(j => (a[j] + (b[j] - a[j]) * k) / 255);
	}
	return ramp[ramp.length - 1].slice(1).map(v => v / 255);
}

// Textures pre-scaled to the bar's size: canvas patterns resample at tile edges when given a scale,
// which draws seams (WoW's REPEAT wrap doesn't), so patterns only ever get translated.
const scaledCache = {};
function scaled(key, k, src) {
	const im = src || imgs[key], w = Math.max(1, Math.round(im.width * k)), h = Math.max(1, Math.round(im.height * k));
	const id = key + '|' + w + 'x' + h;
	if (scaledCache[id]) return scaledCache[id];
	const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
	const g = cv.getContext('2d'); g.imageSmoothingQuality = 'high'; g.drawImage(im, 0, 0, w, h);
	return scaledCache[id] = cv;
}
// the inverse of the smelting nose mask (smelt_nose, white = kept): drawn with destination-out it erases what the game's mask hides
let noseEraseCv = null;
function noseErase() {
	if (noseEraseCv) return noseEraseCv;
	const im = imgs.smelt_nose, cv = document.createElement('canvas'); cv.width = im.width; cv.height = im.height;
	const g = cv.getContext('2d'); g.drawImage(im, 0, 0);
	const d = g.getImageData(0, 0, cv.width, cv.height);
	for (let i = 0; i < d.data.length; i += 4) { d.data[i] = d.data[i + 1] = d.data[i + 2] = 0; d.data[i + 3] = 255 - d.data[i + 3]; }
	g.putImageData(d, 0, 0);
	return noseEraseCv = cv;
}
function pattern(g, cv, du, dv) {
	const pat = g.createPattern(cv, 'repeat');
	pat.setTransform(new DOMMatrix().translate(-Math.round((((du % 1) + 1) % 1) * cv.width), -Math.round((((dv % 1) + 1) % 1) * cv.height)));
	return pat;
}

function roundRectPath(g, x, y, w, h, r) {
	r = Math.max(0, Math.min(r, h / 2, w / 2));
	g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
	g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}

// ------------------------------------------------------------------ bar
class Bar {
	constructor(key, parent) {
		this.key = key; this.cfg = EL[key];
		const row = document.createElement('div'); row.className = 'row';
		row.innerHTML = `<div class="name">${this.cfg.label || key}</div>`;
		this.cv = document.createElement('canvas'); row.appendChild(this.cv); parent.appendChild(row);
		this.g = this.cv.getContext('2d');
		this.off = document.createElement('canvas'); this.og = this.off.getContext('2d');
		// three slots, enough for any look (a channel can swap in a look with more layers)
		this.layerOff = [0, 1, 2].map(i => ({ u: rand(0, 1), v: (this.cfg.layers[i] || {}).sv ? rand(0, 1) : 0 }));   // only layers that scroll vertically tile vertically
		this.wob = [0, 1, 2].map(() => wobble());
		this.speedWob = [0, 1, 2].map(() => wobble(.7));
		this.glowWob = wobble(1.5); this.sparkWob = wobble(6);
		this.parts = []; this.emitAcc = this.cfg.emit.map(() => 0);
		this.clock = rand(0, 100);
		this.newCast();
	}
	newCast() {
		this.dur = rand(1.6, 3.2); this.elapsed = 0; this.state = 'cast'; this.stateT = 0;
		this.vines = this.cfg.vines ? this.makeVines() : null;
		this.sweepT = rand(.4, 1.5); this.sweep = null;
		this.trackU = rand(0, 1); this.trackU2 = rand(0, 1);
		if (this.cfg.pond) this.makePond();
		if (this.cfg.mine) { this.swingT = rand(0, .8); this.lastSwing = 0; }
		if (this.cfg.skin) this.makeSkin();
		if (this.cfg.smith || this.cfg.smelt) this.makeForge();
		if (this.cfg.storm) this.makeStorm();
		if (this.cfg.alchemy) this.makeAlchemy();
		if (this.cfg.tailor) this.makeTailor();
		if (this.cfg.leather) this.makeLeather();
		if (this.cfg.ench) this.makeEnch();
		this.glyphs = []; this.glyphT = 0; this.twinkles = []; this.twinkleAcc = 0; this.circles = []; this.circleNext = rand(.2, 1.2) * settings.H;
		this.cv.style.opacity = 1; this.parts = [];
	}
	interrupt() { if (this.state === 'cast') { this.state = 'interrupted'; this.stateT = 0; } }

	// ---- nature: vines that grow with the bar, twisting around each other on a random path
	makeVines() {
		const n = Math.random() < .5 ? 2 : 3, base = rand(0, 6.283);
		return Array.from({ length: n }, (_, i) => ({
			ph: base + i * 6.283 / n + rand(-.4, .4), freq: rand(.28, .45), fw: wobble(2.2), yw: wobble(3),
			amp: rand(.24, .36), w: rand(.075, .105), moss: Math.random() < .4, x: 0, pts: [], leaves: [], nextThorn: rand(.2, .6) * settings.H, thornSide: 1,
		}));
	}
	growVines(fillW, H) {
		for (const v of this.vines) {
			while (v.x < fillW) {
				v.x += 2;
				const xn = v.x / H;
				v.ph += (2 / H) * 6.283 * v.freq * (1 + .45 * v.fw(xn * .35));   // twist rate drifts randomly
				const y = H / 2 + H * v.amp * Math.sin(v.ph) + H * .07 * v.yw(xn * .5);
				v.pts.push({ x: v.x, y, d: Math.cos(v.ph) });
				const p0 = v.pts[v.pts.length - 2], tang = p0 ? Math.atan2(y - p0.y, 2) : 0;
				if (Math.random() < .10 && p0) {
					const side = Math.random() < .5 ? -1 : 1;
					v.leaves.push({ x: v.x, y, ang: tang + side * rand(.8, 1.8), size: H * rand(.34, .55), born: this.clock, d: Math.cos(v.ph),
						tint: pick([[90, 165, 60], [60, 135, 50], [125, 175, 70], [55, 115, 60], [150, 185, 80], [80, 150, 45]]) });
				}
				if (v.x >= v.nextThorn && p0) {   // thorns at uneven spacing, alternating sides, raked toward the tip
					v.nextThorn = v.x + H * rand(.2, .45); v.thornSide = -v.thornSide;
					v.leaves.push({ x: v.x, y, thorn: true, ang: tang + v.thornSide * (Math.PI / 2 - rand(.25, .6)), side: v.thornSide,
						size: H * v.w * rand(2.8, 3.6), born: this.clock, d: Math.cos(v.ph) });
				}
				if (this.cfg.flowers && p0 && Math.random() < .045) this.addFlower(v, v.x, y);
				if (Math.random() < .008) {   // a leaf lets go and falls
					this.spawn(P({ t: 'p_leaf', color: [pick([[110, 165, 60], [150, 170, 70], [170, 140, 60]])], size: [.3, .42], life: [1.2, 2], vx: [-14, -4], vy: [10, 26], spin: [-3, 3], add: false }), v.x, y);
				}
			}
		}
	}
	drawVines(g, ox, oy, fillW, H) {
		// Three passes (dark outline, bark core, highlight) so segments blend into one smooth stem.
		const seg = (v, front) => {
			const pts = v.pts, core = v.moss ? [70, 92, 36] : [104, 70, 38];
			g.lineCap = 'round'; g.lineJoin = 'round';
			for (let pass = 0; pass < (front ? 3 : 2); pass++) {
				for (let i = 1; i < pts.length; i++) {
					const a = pts[i - 1], b = pts[i];
					if (b.x > fillW) break;
					if ((b.d >= 0) !== front) continue;
					const taper = Math.max(.2, Math.min(1, (fillW - b.x) / (H * .8)));
					const w = H * v.w * (front ? .85 + .3 * b.d : .7 + .2 * b.d) * taper;
					const lit = front ? .72 + .28 * b.d : .42 + .18 * (1 + b.d);
					if (pass === 0) { g.strokeStyle = 'rgba(22,14,6,.85)'; g.lineWidth = w + 1.4; }
					else if (pass === 1) { g.strokeStyle = rgba(core.map(c => Math.round(c * lit)), 1); g.lineWidth = w; }
					else { g.strokeStyle = `rgba(200,170,110,${.3 * lit})`; g.lineWidth = Math.max(.5, w * .22); }
					const dy = pass === 2 ? -w * .22 : 0;
					g.beginPath(); g.moveTo(ox + a.x, oy + a.y + dy); g.lineTo(ox + b.x, oy + b.y + dy); g.stroke();
				}
			}
		};
		const leaves = (v, front) => {
			for (const l of v.leaves) {
				if (l.x > fillW || (l.d >= 0) !== front) continue;
				const s = easeOutBack(clamp01((this.clock - l.born) / .45)) * l.size;
				const shade = front ? 1 : .6;
				if (l.flower) {   // herbalism: a blossom sitting on the vine
					const c = l.tint.map(x => Math.round(x * shade));
					g.save(); g.translate(ox + l.x, oy + l.y); g.rotate(l.rot);
					g.drawImage(tinted('p_flower', c), -s / 2, -s / 2, s, s);
					g.restore(); continue;
				}
				g.save(); g.translate(ox + l.x, oy + l.y); g.rotate(l.ang);
				if (l.thorn) {
					// sprite points up with its base on the bottom edge: turn "up" to the thorn's angle
					g.rotate(Math.PI / 2); if (l.side < 0) g.scale(-1, 1);
					const sh = Math.round(255 * shade);
					g.drawImage(tinted('p_thorn', [sh, sh, sh]), -s / 2, -s - H * v.w * .3, s, s);
				} else {
					g.rotate(-Math.PI / 4);
					g.translate(s * .35, s * .35);   // the leaf's base sits on the vine
					g.drawImage(tinted('p_leaf', l.tint.map(c => Math.round(c * shade))), -s / 2, -s / 2, s, s);
				}
				g.restore();
			}
		};
		for (const v of this.vines) seg(v, false);
		for (const v of this.vines) leaves(v, false);
		for (const v of this.vines) seg(v, true);
		for (const v of this.vines) leaves(v, true);
	}

	// ---- frost: the freeze front at the fill edge, where the flowing water turns to ice
	drawFreeze(g, fillW, H) {
		if (fillW < 2) return;
		const w = H * 1.4;
		g.save(); g.globalCompositeOperation = 'lighter';
		g.globalAlpha = .75 + .2 * Math.sin(this.clock * 7);
		g.drawImage(imgs.frost_front, fillW - w, 0, w, H);
		g.restore();
	}

	// ---- frost while channelling: the front faces right, into the ice the drained part has become
	drawFreezeReverse(g, fillW, H) {
		const W = settings.W, w = Math.min(H * 1.4, W - fillW);
		if (w < 2) return;
		g.save(); g.globalCompositeOperation = 'lighter';
		g.globalAlpha = .75 + .2 * Math.sin(this.clock * 7);
		g.translate(fillW + w, 0); g.scale(-1, 1);
		const img = imgs.frost_front, sw = img.width * w / (H * 1.4);
		g.drawImage(img, img.width - sw, 0, sw, img.height, 0, 0, w, H);
		g.restore();
	}

	// ---- fishing: lily pads drifting on the surface, fish swimming below, the bobber at the cast edge
	makePond() {
		const W = settings.W, H = settings.H;
		this.lilies = Array.from({ length: 2 + Math.floor(rand(0, 3)) }, () => ({ x: rand(.08, .92) * W, s: rand(.75, 1.05), drift: rand(-2.5, 2.5), ph: rand(0, 6.283), flower: Math.random() < .3 }));
		this.fish = Array.from({ length: 2 + Math.floor(rand(0, 2)) }, () => ({ x: rand(.1, .9) * W, y: rand(.45, .82), dir: Math.random() < .5 ? -1 : 1, speed: rand(5, 13), s: rand(.6, .85), c: pick(FISH_TINTS), ph: rand(0, 6.283), turnT: rand(2, 6) }));
		this.ripples = []; this.rippleT = 0;
	}
	drawPond(g, ox, oy, fillW, H, dt) {
		const W = settings.W, k = H / 28, surf = H * .13;
		// fish, faint under the water
		for (const f of this.fish) {
			f.turnT -= dt;
			f.x += f.dir * f.speed * k * dt;
			if (f.x < H * .6 || f.x > W - H * .6 || f.turnT <= 0) { f.dir = f.x < H * .6 ? 1 : f.x > W - H * .6 ? -1 : -f.dir; f.turnT = rand(2, 6); }
			const s = H * f.s, y = H * f.y + Math.sin(this.clock * 2 + f.ph) * H * .04;
			g.save(); g.globalAlpha = .55; g.translate(ox + f.x, oy + y); g.scale(f.dir, 1); g.rotate(Math.sin(this.clock * 9 + f.ph) * .06);
			g.drawImage(tinted('p_fish', f.c), -s / 2, -s / 2, s, s);
			g.restore();
		}
		// lily pads on the surface
		for (const l of this.lilies) {
			l.x += l.drift * k * dt;
			if (l.x < H * .5) l.drift = Math.abs(l.drift); else if (l.x > W - H * .5) l.drift = -Math.abs(l.drift);
			const s = H * l.s, y = surf + Math.sin(this.clock * 1.6 + l.ph) * H * .02;
			g.drawImage(imgs.p_lily, ox + l.x - s / 2, oy + y - s / 2, s, s);
			if (l.flower) { const fs = s * .45; g.drawImage(tinted('p_flower', [255, 170, 200]), ox + l.x - fs / 2 + s * .08, oy + y - fs * .75, fs, fs); }
		}
		if (fillW < 1) return;
		// ripples spreading from the bobber
		this.rippleT -= dt;
		if (this.state === 'cast' && this.rippleT <= 0) { this.rippleT = rand(.7, 1.1); this.ripples.push({ x: fillW, age: 0 }); }
		this.ripples = this.ripples.filter(r => (r.age += dt) < 1.4);
		g.save(); g.globalCompositeOperation = 'lighter';
		for (const r of this.ripples) {
			const t = r.age / 1.4, w = H * (.4 + 1.4 * t);
			g.globalAlpha = (1 - t) * .6;
			g.drawImage(imgs.p_ripple, ox + r.x - w / 2, oy + surf - w * .15, w, w * .3);
		}
		g.restore();
		// the line and the bobber
		const by = surf + Math.sin(this.clock * 3.2) * H * .05, bs = H * .95;
		g.strokeStyle = 'rgba(230,240,240,.45)'; g.lineWidth = 1;
		g.beginPath(); g.moveTo(ox + fillW, oy + by - bs * .45); g.quadraticCurveTo(ox + fillW - H * .3, oy - H * .4, ox + fillW - H * .9, oy - H * .85); g.stroke();
		g.drawImage(imgs.p_bobber, ox + fillW - bs / 2, oy + by - bs * .55, bs, bs);
	}

	// ---- mining: the cart rolls along the rail to the cast edge; a pickaxe strikes the wall at the end
	drawMine(g, ox, oy, fillW, H, dt) {
		const W = settings.W, railY = H * .92;   // the near rail's top, at the very bottom of the bar (as Effects.lua)
		// the pickaxe swings from a pivot above the bar: raise slowly, strike fast
		const P = H * 1.1, L = P * .76, cycle = .8;
		this.swingT = (this.swingT + dt) % cycle;
		const t = this.swingT / cycle, deg = Math.PI / 180;
		let th;
		if (t < .62) th = (100 - 92 * Math.sin(t / .62 * Math.PI / 2)) * deg;          // raise
		else if (t < .72) th = (8 + 92 * ((t - .62) / .1) ** 2) * deg;                 // strike
		else th = (100 - 8 * Math.sin((t - .72) / .28 * Math.PI)) * deg;              // recoil
		const hx = W + H * .05, hy = H * .5;                                             // the head lands on the wall at the bar's end
		const px = hx - L * Math.sin(100 * deg), py = hy + L * Math.cos(100 * deg);
		g.save(); g.translate(ox + px, oy + py); g.rotate(th);
		g.drawImage(imgs.p_pickaxe, -P / 2, -P / 2 - P * .45, P, P);
		g.restore();
		if (this.state === 'cast' && t >= .72 && this.lastSwing < .72) {                 // impact: chips and sparks
			for (let i = 0; i < 5; i++) this.spawn(CHIP, hx + rand(-2, 2), hy + rand(-2, 2));
			for (let i = 0; i < 4; i++) this.spawn(SPARK, hx, hy);
		}
		this.lastSwing = t;
		// the cart: its front at the fill edge, wheels on the rail, lantern glowing
		const C = H * 1.0, wr = C * .13;   // sized so the ore heap stays inside the bar
		const cx = Math.max(-C * .2, fillW - C * .94), cy = railY - wr * 1.1 - C * .80;
		for (const u of [.27, .73]) {
			const wx = cx + C * u, wy = railY - wr;
			g.save(); g.translate(ox + wx, oy + wy); g.rotate(fillW / wr);
			g.drawImage(imgs.p_wheel, -wr, -wr, wr * 2, wr * 2);
			g.restore();
		}
		g.drawImage(imgs.p_cart, ox + cx, oy + cy, C, C);
		const lx = cx + C * .80, ly = cy + C * .60, ls = H * (.9 + .1 * Math.sin(this.clock * 11));
		g.save(); g.globalCompositeOperation = 'lighter'; g.globalAlpha = .55;
		g.drawImage(tinted('p_soft', [255, 190, 90]), ox + lx - ls / 2, oy + ly - ls / 2, ls, ls);
		g.restore();
	}

	// ---- skinning: the pelt rolls back over marbled meat (as Effects.lua). The fur ahead is the track,
	// tinted to this cast's pelt; the meat is the fill layer; the pool and the meat's light and shade are
	// drawn inside the fill; the roll and the knife stand in front of the bar's frame line.
	makeSkin() {
		peltTurn = (peltTurn + 1) % PELTS.length;
		const p = PELTS[peltTurn];
		this.trackTint = p;
		this.rollTint = p.fur.map((c, i) => Math.min(255, c + p.tips[i] * .35));
		this.knifeTex = Math.random() < .4 ? 'p_knife_antler' : 'p_knife_wood';
		this.spiralFlip = Math.random() < .5;
		this.pool = []; this.poolNext = settings.H * rand(.5, .9); this.skinEnd = null;
	}
	skinGeom(fillW, H) {
		const r = H * (.2 + .16 * fillW / settings.W);
		return { r, xc: fillW - r * .9 };
	}
	blotRadius(q) {
		const age = this.clock - q.born, t = clamp01(age / q.grow);
		return q.max * ((1 - (1 - t) * (1 - t)) * .75 + .25 * Math.min(1, Math.log(1 + age * .6) / 2.2));
	}
	// the meat's light and shade and the pool of blood, inside the fill (g: bar pixels, y down)
	drawSkinMeat(g, fillW, H) {
		const { r, xc } = this.skinGeom(fillW, H);
		while (this.state === 'cast' && xc - r * 1.6 > this.poolNext && this.pool.length < 80) {
			const x = this.poolNext, nearText = clamp01((x - H * .6) / (H * 3.2));
			this.pool.push({ x, y: H - H * (.5 + rand(-.14, .14)), max: H * rand(.2, .32) * (.55 + .45 * nearText), born: this.clock, grow: rand(.5, .9),
				fade: 1 - .55 * (1 - Math.min(1, x / (H * 4))), cell: Math.floor(rand(0, 4)), glint: Math.random() < .3, ph: rand(0, 6.283) });
			this.poolNext += H * rand(.26, .4);
		}
		const band = (key, left, right, tint, a, flip, add) => {
			left = Math.max(0, left); right = Math.min(settings.W, right);
			if (right - left <= .5) return;
			g.save(); g.globalAlpha = a; g.globalCompositeOperation = add ? 'lighter' : 'source-over';
			if (flip) { g.translate(right, 0); g.scale(-1, 1); g.drawImage(tinted(key, tint), 0, 0, right - left, H); }
			else g.drawImage(tinted(key, tint), left, 0, right - left, H);
			g.restore();
		};
		band('edge_h', 0, xc - H * 2, [0, 0, 0], .22, true);
		band('edge_h', xc - H * 1.4, xc, [255, 120, 110], .12, false, true);
		band('edge_h', xc - H * .6, xc, [0, 0, 0], .55);
		const blot = (q, scale, tint, a, dx, dy) => {
			const s = this.blotRadius(q) / .3 * scale;
			g.globalAlpha = a * q.fade;
			g.drawImage(tinted('p_pool', tint), q.cell * 64, 0, 64, 64, q.x + dx - s / 2, q.y + dy - s / 2, s, s);
		};
		for (const q of this.pool) blot(q, 1.12, [41, 0, 5], .45, H * .02, H * .03);
		for (const q of this.pool) blot(q, 1, [163, 18, 26], 1, 0, 0);
		for (const q of this.pool) blot(q, .84, [110, 5, 10], 1, 0, 0);
		g.globalCompositeOperation = 'lighter';
		for (const q of this.pool) if (q.glint) {
			const gr = this.blotRadius(q), s = gr * .7;
			g.globalAlpha = (.3 + .15 * Math.sin(this.clock * .7 + q.ph)) * q.fade;
			g.drawImage(tinted('p_soft', [255, 225, 225]), q.x + gr * .15 - s / 2, q.y - gr * .35 - s / 2, s, s);
		}
		g.globalAlpha = 1; g.globalCompositeOperation = 'source-over';
	}
	// the coat just ahead of the roll lies in its shadow (the fx frame, under the frame line)
	drawSkinAhead(g, ox, oy, fillW, H) {
		if (fillW <= 1) return;
		const { r, xc } = this.skinGeom(fillW, H), left = xc + r, w = Math.min(H * .5, settings.W - left);
		if (w <= .5) return;
		g.save(); g.globalAlpha = .45; g.translate(ox + left + w, oy); g.scale(-1, 1);
		g.drawImage(tinted('edge_h', [0, 0, 0]), 0, 0, w, H); g.restore();
	}
	// the roll and the knife, over the frame line
	drawSkinTools(g, ox, oy, fillW, H) {
		if (fillW <= 1) return;
		const { r, xc } = this.skinGeom(fillW, H);
		if (this.state !== 'cast') this.skinEnd = this.skinEnd ?? this.clock;
		const lift = this.skinEnd !== null ? Math.min(1, (this.clock - this.skinEnd) / .5) ** 2 : 0;
		const ry = r * .3, top = -H * .08, bodyH = H * 1.16 + ry;
		// shadow cast on the bar
		g.globalAlpha = .45;
		g.drawImage(tinted('glow', [0, 0, 0]), ox + xc + H * .08 - (r * 2 + H * .5) / 2, oy + H * .56 - H * .75, r * 2 + H * .5, H * 1.5);
		g.globalAlpha = 1;
		// the side: fur turning as it rolls, cut to shape, shaded
		const bw = Math.max(1, Math.ceil(r * 2)), bh = Math.max(1, Math.ceil(bodyH));
		if (!this.rollCv) this.rollCv = document.createElement('canvas');
		const cv = this.rollCv; cv.width = bw; cv.height = bh;
		const c = cv.getContext('2d'), tile = r * 4, off = (xc * .9) % tile;
		const fur = tinted('p_roll_fur', this.rollTint);
		for (let y = -off; y < bh; y += tile) c.drawImage(fur, 0, y, bw, tile);
		c.globalCompositeOperation = 'destination-in'; c.drawImage(imgs.p_roll_mask, 0, 0, bw, bh);
		c.globalCompositeOperation = 'source-over'; c.drawImage(imgs.p_roll_shade, 0, 0, bw, bh);
		g.drawImage(cv, ox + xc - r, oy + top, r * 2, bodyH);
		// the top end: the hide rolled on itself
		g.save(); g.translate(ox + xc, oy + top); if (this.spiralFlip) g.scale(-1, 1);
		g.drawImage(imgs.p_roll_end, -r, -ry, r * 2, ry * 2);
		g.drawImage(tinted('p_roll_spiral', this.trackTint.fur), -r, -ry, r * 2, ry * 2);
		g.restore();
		// the knife, upright just left of the roll: its curved edge rests on the roll's edge, the tip at the
		// bar's bottom, the handle standing above; it saws up and down and lifts away up and to the left
		const saw = this.state === 'cast' ? Math.sin(this.clock * 13) * H * .05 : 0;
		const tipX = xc - r - KNIFE.belly * H - lift * H * .6;
		const tipY = H * .04 - saw + lift * H * 1.2;     // up from the bar's bottom
		g.globalAlpha = 1 - lift;
		g.drawImage(imgs[this.knifeTex], ox + tipX - KNIFE.tipX * H, oy + H - (tipY + KNIFE.tipY * H), KNIFE.w * H, KNIFE.h * H);
		const gx = tipX + H * .07, gy = tipY + KNIFE.L * H * (.25 + .5 * (.5 + .5 * Math.sin(this.clock * 13)));
		g.globalCompositeOperation = 'lighter'; g.globalAlpha = .45 * (1 - lift);
		g.drawImage(imgs.p_soft, ox + gx - H * .1, oy + H - gy - H * .1, H * .2, H * .2);
		g.globalAlpha = 1; g.globalCompositeOperation = 'source-over';
	}

	// ---- blacksmithing and smelting (as Effects.lua): hot metal over the fill, the hammer and the ladle in front
	makeForge() {
		if (this.cfg.smith) this.smith = { u: rand(.3, .6), period: rand(.62, .78), flares: [], wispAcc: 0, flashAt: -1, tex: Math.random() < .4 ? 'p_hammer_antler' : 'p_hammer_wood', endAt: null };
		if (this.cfg.smelt) this.smelt = { cool: rand(.16, .22), sparkAcc: 0, streamV: rand(0, 1), bob: wobble(2), endAt: null };
	}
	forgeSince(o) {
		if (this.state !== 'cast' && o.endAt === null) { o.endAt = this.clock; o.quench = this.state === 'done'; }
		return o.endAt === null ? 0 : this.clock - o.endAt;
	}
	// inside the fill (og in bar pixels, y down)
	drawSmithFill(og, fillW, H) {
		const s = this.smith, W = settings.W, p = fillW / W, base = .2 + .4 * p;
		const since = this.forgeSince(s);
		if (s.quench && !s.burst) {   // the quench: a rolling cloud of steam bursts off the bar
			s.burst = true;
			for (let i = 0; i < Math.min(60, Math.floor(W / H * 5)); i++) this.spawn(QUENCH, rand(0, W), H - H * rand(.2, 1.1));
		}
		const q = s.quench ? 1 - (1 - Math.min(1, since / .35)) ** 2 : 0, cool = s.endAt !== null && !s.quench ? Math.max(0, 1 - since / .7) : 1;
		const dpr = window.devicePixelRatio || 1, k = H * dpr / 64;
		og.save(); og.setTransform(1, 0, 0, 1, 0, 0);
		og.globalAlpha = Math.max(0, Math.min(1, (base - .2) / .4)) * (1 - q) * cool;
		og.fillStyle = pattern(og, scaled('smith_hot', k), this.layerOff[0].u, 0); og.fillRect(0, 0, fillW * dpr, H * dpr);
		og.restore();
		// the cast edge's extra heat: smith_edge tinted to the heat there, its falloff anchored to the edge
		const span = H * 4.4, l = Math.max(0, fillW - span), e = imgs.smith_edge;
		og.save(); og.globalAlpha = (1 - q) * cool;
		if (fillW - l > .5) {
			const c = heatRGB(IRON_HEAT, base + .4 * cool).map(v => Math.round(v * 255 / 8) * 8);   // quantised, so the tint cache stays small
			const sx = e.width * (1 - (fillW - l) / span);
			og.drawImage(tinted('smith_edge', c), sx, 0, e.width - sx, e.height, l, 0, fillW - l, H);
		}
		og.globalCompositeOperation = 'lighter';
		// impact flares on struck spots, cooling over a couple of seconds
		s.flares = s.flares.filter(f => this.clock - f.born < 2);
		for (const f of s.flares) {
			og.globalAlpha = .9 * Math.exp(-(this.clock - f.born) * 2.2) * (1 - q);
			og.drawImage(tinted('p_soft', [255, 199, 102]), f.x - H * .8, H * .5 - H * .65, H * 1.6, H * 1.3);
		}
		og.restore();
		if (q > 0) { og.globalAlpha = q; og.drawImage(imgs.smith_temper, 0, 0, W, H); og.globalAlpha = 1; }
	}
	// the hammer's rhythm, its strike flash and the steam (under the frame line)
	drawSmithFx(g, ox, oy, fillW, H, dt) {
		const s = this.smith, p = fillW / settings.W, base = .2 + .4 * p, hx = Math.max(H * .3, fillW - H * .3);
		if (this.state === 'cast') {
			s.u += dt / s.period;
			if (s.u >= 1) {
				s.u -= 1;
				if (fillW > H * .2) {   // a strike: flash, sparks, a puff of steam, the struck spot flares
					for (let i = 0; i < Math.floor(10 + 10 * (base + .4)); i++) this.spawn(FORGE_SPARK, hx + rand(-.2, .2) * H, H * rand(-.05, .1));
					for (let i = 0; i < 5; i++) this.spawn(STRIKE_STEAM, hx + rand(-.45, .45) * H, H * rand(-.15, .25));
					s.flares.push({ x: hx, born: this.clock }); s.flashAt = this.clock;
				}
			}
			if (fillW > 2) {   // steam wisps rising off the hot part, more as it heats
				s.wispAcc += (2 + 12 * p) * fillW / 300 * dt;
				while (s.wispAcc >= 1) { s.wispAcc--; this.spawn(WISPS[Math.min(3, Math.floor(p * 4))], rand(0, fillW), H * rand(-.05, .15)); }
			}
		}
		const fa = Math.max(0, 1 - (this.clock - s.flashAt) / .18);
		if (fa > 0) {
			const sc = .5 + 1.1 * (1 - fa * fa), w = H * sc * 2.6, h = H * sc * 1.6;
			g.save(); g.globalCompositeOperation = 'lighter'; g.globalAlpha = .95 * fa;
			g.drawImage(tinted('p_soft', [255, 230, 166]), ox + hx - w / 2, oy - h / 2, w, h); g.restore();
		}
	}
	drawSmithTools(g, ox, oy, fillW, H) {
		const s = this.smith, since = s.endAt === null ? 0 : this.clock - s.endAt, ha = s.endAt === null ? 1 : Math.max(0, 1 - since * 3);
		if (ha <= 0 || fillW <= 1) return;
		const hx = Math.max(H * .3, fillW - H * .3), lift = hammerLift(s.u);
		const pose = Math.max(0, Math.min(HAM.poses - 1, Math.round(lift / HAM.max * (HAM.poses - 1))));
		const k = H * HAM.scale, px = hx - HAM.L * k, py = -HAM.face * k, size = HAM.span * k, cell = imgs[s.tex].width / 4;
		g.globalAlpha = ha;
		g.drawImage(imgs[s.tex], (pose % 4) * cell + .5, Math.floor(pose / 4) * cell + .5, cell - 1, cell - 1, ox + px - HAM.ox * k, oy + py - HAM.oy * k, size, size);
		g.globalAlpha = 1;
	}
	drawSmeltFill(og, fillW, H) {
		const s = this.smelt, W = settings.W, since = this.forgeSince(s), cool = s.endAt === null ? 1 : Math.exp(-since * 1.4);
		if (fillW <= 1) return;
		const land = Math.max(0, fillW - H * .32), fold = W * s.cool + H * 1.2, span = 3.2 * fold, left = land - span, img = imgs.smelt_hot;   // as Effects.lua SmeltFold/SmeltSpan
		// the seams' glow, in gradient segments over the crust layer (as Effects.lua UpdateSmelt and SetGradient)
		const dpr = window.devicePixelRatio || 1, k = H * dpr / 64, seam = scaled('smelt_seam', k);
		const T = this.seamCnv || (this.seamCnv = document.createElement('canvas'));
		if (T.width !== Math.ceil(W * dpr) || T.height !== Math.ceil(H * dpr)) { T.width = Math.ceil(W * dpr); T.height = Math.ceil(H * dpr); }
		const t = T.getContext('2d');
		t.setTransform(1, 0, 0, 1, 0, 0); t.globalCompositeOperation = 'source-over'; t.clearRect(0, 0, T.width, T.height);
		const gr = t.createLinearGradient(0, 0, Math.max(1, land * dpr), 0), SEGS = 5;
		let x0 = 0;
		for (let i = 1; i <= SEGS; i++) {
			const x1 = i === SEGS ? land : Math.max(0, land - (SEGS - i) * fold);
			for (const x of [x0, x1]) if (land > 0) gr.addColorStop(clamp01(x / land), rgba(heatRGB(MELT_HEAT, Math.min(1, cool * Math.exp(-(land - x) / fold) + .03)).map(v => v * 255), 1));
			x0 = Math.max(x0, x1);
		}
		t.fillStyle = gr; t.fillRect(0, 0, land * dpr, T.height);
		t.globalCompositeOperation = 'destination-in'; t.fillStyle = pattern(t, seam, this.layerOff[0].u, 0); t.fillRect(0, 0, land * dpr, T.height);
		if (land > .5) og.drawImage(T, 0, 0, land * dpr, T.height, 0, 0, land, H);
		og.globalAlpha = cool;
		og.drawImage(img, left, 0, span, H);
		if (fillW > land) og.drawImage(img, img.width - 1, 0, 1, img.height, land, 0, fillW - land + 1, H);   // past the landing point it stays at its hottest
		og.globalAlpha = 1;
		// the pour's rounded front (as Effects_Forge.lua's nose mask on everything in the smelting fill): the fill's last half
		// bar height is cut to a soft D-shaped nose (erase through the mask's inverse), and the dark track shows through it
		const nw = H * .5, nx = fillW - nw;
		og.globalCompositeOperation = 'destination-out'; og.drawImage(noseErase(), nx, 0, nw + 1, H);
		og.save(); og.setTransform(1, 0, 0, 1, 0, 0); og.globalCompositeOperation = 'destination-over';
		og.fillStyle = pattern(og, scaled('smelt_dark', k), this.trackU, 0); og.fillRect(nx * dpr, 0, (nw + 1) * dpr, H * dpr); og.restore();
		og.globalCompositeOperation = 'source-over';
	}
	drawSmeltFx(g, ox, oy, fillW, H, dt) {
		const s = this.smelt, since = s.endAt === null ? 0 : this.clock - s.endAt, back = s.endAt === null ? 0 : 1 - (1 - Math.min(1, since / .5)) ** 2;
		const land = Math.max(0, fillW - H * .32), cool = s.endAt === null ? 1 : Math.exp(-since * 1.4);
		if (fillW > 1 && back < 1) {
			g.save(); g.globalCompositeOperation = 'lighter'; g.globalAlpha = .35 * (1 - back);
			g.drawImage(tinted('p_soft', [255, 130, 41]), ox + land - H * 1.1, oy + H * .12 - H * 1.1, H * 2.2, H * 2.2); g.restore();
		}
		if (fillW > 1) {   // the nose's glow, clipped to the bar but not the fill, so it spills over the dark track ahead (Effects_Forge.lua forge.nose)
			g.save(); g.beginPath(); g.rect(ox, oy, settings.W, H); g.clip();
			g.globalCompositeOperation = 'lighter'; g.globalAlpha = .4 * cool;
			g.drawImage(tinted('p_soft', [255, 179, 77]), ox + fillW - H * .15 - H * .8, oy + H * .5 - H * .8, H * 1.6, H * 1.6); g.restore();
		}
		if (this.state === 'cast' && fillW > 1) {
			s.sparkAcc += dt * 26;
			while (s.sparkAcc >= 1) { s.sparkAcc--; this.spawn(POUR_SPARK, land, H * .12); if (Math.random() < .15) this.spawn(POUR_DROP, land, H * .12); }
		}
		s.back = back;
	}
	drawSmeltTools(g, ox, oy, fillW, H, dt) {
		const s = this.smelt, back = s.back || 0;
		if (!(fillW > .5 || this.state === 'cast') || back >= 1) return;
		const land = Math.max(0, fillW - H * .32), k = H * LADLE.scale;
		const lipX = land + H * .11, lipY = -H * .3 - back * H * .3 - (this.state === 'cast' ? s.bob(this.clock) * H * .02 : 0);   // y down
		// the stream, behind the ladle: from the spout down into the metal, flowing
		if (this.state === 'cast') {
			const top = lipY + H * .03, bottom = H * .22, sw = H * .11 / .64, tile = sw * 4, img = imgs.smelt_stream, x = ox + land + H * .015 - sw / 2;
			s.streamV = ((s.streamV - dt * 2.2) % 1 + 1) % 1;
			g.save(); g.beginPath(); g.rect(x, oy + top, sw, bottom - top); g.clip();
			for (let y = top - (1 - s.streamV) * tile; y < bottom; y += tile) g.drawImage(img, x, oy + y, sw, tile);
			g.restore();
		}
		const pose = Math.round(back * 3), cell = imgs.p_ladle.width / 2, size = LADLE.span * k;
		g.globalAlpha = 1 - back * back;
		g.drawImage(imgs.p_ladle, (pose % 2) * cell, Math.floor(pose / 2) * cell, cell, cell, ox + lipX - LADLE.ox * k, oy + lipY - LADLE.oy * k, size, size);
		g.globalCompositeOperation = 'lighter'; g.globalAlpha = .5 * (1 - back);
		g.drawImage(tinted('p_soft', [255, 150, 41]), ox + lipX - H * .04 - H * .275, oy + lipY - H * .275, H * .55, H * .55);
		g.globalAlpha = 1; g.globalCompositeOperation = 'source-over';
	}

	// ---- lightning (as Effects_Storm.lua): painted clouds drift over the sky; forked bolts strike and light them from within
	makeStorm() {
		// as Effects_Storm.lua MakeStorm / LayRow: every cast lays copies of the one cloud afresh, a far row of small
		// faint ones high up and a near row of big ones with their bases low, each mirrored or not, at its own pace
		const W = settings.W, H = settings.H, clouds = [];
		const lay = (h0, h1, y0, y1, a, v0, v1, sp0, sp1, max) => {
			for (let x = -H, n = 0; x < W + H && n < max; x += H * rand(sp0, sp1), n++)
				clouds.push({ x, y: H * rand(y0, y1), h: H * rand(h0, h1), flip: Math.random() < .5, v: rand(v0, v1) * H, ph: rand(0, 6.283), a });
		};
		lay(.45, .7, .1, .35, .65, .03, .06, 1.4, 2.2, 24);
		lay(1.3, 1.7, .6, .8, 1, .07, .13, 1.3, 1.8, 24);
		this.storm = { clouds, nextBolt: .15, flash: 0, flashX: 0, sheet: 0, sheetX: 0, roll: wobble(2), bolts: [] };
	}
	drawStormFill(og, fillW, H, dt) {
		const s = this.storm, W = settings.W, casting = this.state === 'cast';
		if (casting && Math.random() < dt * .8) { s.sheet = rand(.35, .6); s.sheetX = rand(0, Math.max(1, fillW)); }
		s.sheet = Math.max(0, s.sheet - dt * 3);
		s.nextBolt -= dt;
		if (casting && s.nextBolt <= 0 && fillW > H * 1.2 && s.bolts.length < 6) {
			s.nextBolt = rand(.08, .3);
			const cx = rand(H * .5, fillW - H * .5);
			s.bolts.push({ cx, cell: Math.floor(rand(0, 8)), flip: Math.random() < .5, age: 0, life: rand(.18, .32), ph: rand(0, 6.283) });
			s.flash = 1; s.flashX = cx;
		}
		let I = s.flash * .6, cx = s.flashX, reach = H * 2.4;
		if (s.sheet * .35 > I) { I = s.sheet * .35; cx = s.sheetX; reach = H * 2; }
		const lit = tinted('storm_cloud', [150, 170, 255]);
		for (const c of s.clouds) {
			c.x += c.v * dt;
			const span = W + c.h * 2.4;
			if (c.x > W + c.h * 1.2) c.x -= span; else if (c.x < -c.h * 1.2) c.x += span;
			const w = c.h * CLOUD.w, h = c.h * CLOUD.h, y = c.y + Math.sin(this.clock * .35 + c.ph) * H * .03;
			og.save(); og.translate(c.x, y); if (c.flip) og.scale(-1, 1);
			og.globalAlpha = c.a; og.drawImage(imgs.storm_cloud, -w / 2, -h / 2, w, h);
			const d = Math.abs(cx - c.x) / reach, k = I * Math.max(0, 1 - d * d);
			if (k > .02) {   // lit from within near the strike: the same cloud again, added, fading with distance
				og.globalCompositeOperation = 'lighter'; og.globalAlpha = c.a * k; og.drawImage(lit, -w / 2, -h / 2, w, h);
				og.globalCompositeOperation = 'source-over';
			}
			og.restore();
		}
		og.globalAlpha = 1;
		og.globalCompositeOperation = 'lighter';
		s.bolts = s.bolts.filter(b => (b.age += dt) < b.life);
		const cw = imgs.p_bolts.width / 4, chh = imgs.p_bolts.height / 2;
		for (const b of s.bolts) {
			og.globalAlpha = (1 - b.age / b.life) * (.7 + .3 * Math.sin(b.age * 90 + b.ph));
			og.save(); og.translate(b.cx, -BOLT.top * H); if (b.flip) og.scale(-1, 1);
			og.drawImage(imgs.p_bolts, (b.cell % 4) * cw, Math.floor(b.cell / 4) * chh, cw, chh, -BOLT.w * H / 2, 0, BOLT.w * H, BOLT.h * H);

			if (before < .725 && after >= .725 && fillW > H * .3) {   // the beat: fluff flies
				s.fresh = 1;
				for (let i = 0; i < 5; i++) this.spawn(P({ t: 'p_soft', color: [lighter(s.cl.weft, .55)], size: [.015, .035], life: [.5, 1.1], vx: [8, 26], vy: [-28, -6], gravity: 8, alpha: .6 }), fillW + rand(0, .1) * H, rand(.1, .9) * H);
			}
		}
		s.fresh = Math.max(0, s.fresh - dt * 3);
		const u = (s.pickT % per) / per, k = Math.floor(s.pickT / per), down = k % 2 === 0;
		const yTop = -H * SHED_REACH, yBot = H * (1 + SHED_REACH), f = smooth01(u / .55);   // y down
		const sy = s.pickT <= 0 ? yTop : down ? yTop + (yBot - yTop) * f : yBot + (yTop - yBot) * f;
		const bump = u > .6 && u < .85 ? Math.sin(Math.PI * (u - .6) / .25) : 0, sign = down ? 1 : -1;

	// inside the fill: the beaten fell, its fresh brightening, the sheen, light along the crown, shade behind the name
	drawTailorFill(og, fillW, H, dt) {
		const s = this.tailor, W = settings.W, L = this.L = this.tailorPick(dt, fillW, H);
		og.fillStyle = 'rgba(0,0,0,.25)'; og.fillRect(fillW - H * .04, 0, H * .04, H);
		og.save(); og.globalCompositeOperation = 'lighter';
		og.globalAlpha = .22 * s.fresh; og.drawImage(tinted('edge_h', [255, 245, 224]), fillW - H * .5, 0, H * .5, H);
		const cx = (this.clock * H * 1.1 + s.sheenPh * W) % (W + H * 6) - H * 3;
		og.globalAlpha = s.cl.sheen; og.drawImage(imgs.sweep, cx - H * 1.6, 0, H * 3.2, H);
		og.globalAlpha = s.cl.sheen * .5; og.drawImage(imgs.alch_band, 0, H * .255, W, H * .25);
		og.restore();
		og.save(); og.globalAlpha = .28; og.translate(Math.min(W, H * 4), 0); og.scale(-1, 1);

	}
	// on the track just past the fell: the threads parting one way, then (flipped) the other
	drawShed(og, fillW, H) {

		if (!L || sw < .5 || fillW < .5) return;
		const img = tinted('tail_shed', s.cl.base);

		}

	}
	// over the frame line, clipped to the bar (as Effects_Tailor.lua's clip frame): the loose weft ends, the weft, the
	// shuttle with its pirn, the reed
	drawTailorTools(g, ox, oy, fillW, H) {
		const s = this.tailor, L = this.L, cl = s.cl;
		if (!L) return;
		if (this.state !== 'cast') s.endAt = s.endAt ?? this.clock;
		const ta = s.endAt === null ? 1 : Math.max(0, 1 - (this.clock - s.endAt) * 2.2);
		g.save(); g.beginPath(); g.rect(ox, oy, settings.W, H); g.clip();
		const tail = tinted('p_tail', lighter(cl.weft, .15));

			g.save(); g.translate(ox + q.x, oy + (q.top ? H * .04 * k : H - H * .04 * k)); g.scale(q.curl ? -1 : 1, q.top ? 1 : -1);
			g.drawImage(tail, -sz / 2, -sz, sz, sz); g.restore();

			g.beginPath(); g.moveTo(ox + fillW, oy + L.from); g.lineTo(ox + fillW + H * .1, oy + syc); g.lineTo(ox + L.sx, oy + L.sy); g.stroke();
			g.strokeStyle = rgba(lighter(cl.weft, .35), .7); g.lineWidth = lw * .35;
			g.beginPath(); g.moveTo(ox + fillW - lw * .2, oy + L.from); g.lineTo(ox + fillW + H * .1 - lw * .2, oy + syc); g.lineTo(ox + L.sx - lw * .2, oy + L.sy); g.stroke();
			// the shuttle (.4 x .8 bar heights, .6 long inside), its pirn (.2 x .8) and the reed (.2 x 1.6, the bar's top .3 down it)
			g.drawImage(imgs.p_shuttle, ox + L.sx - H * .2, oy + L.sy - H * .4, H * .4, H * .8);
			g.drawImage(tinted('p_pirn', lighter(cl.weft, .2)), ox + L.sx - H * .1, oy + L.sy - H * .4, H * .2, H * .8);
			g.drawImage(imgs.p_reed, ox + L.bx - H * .1, oy - H * .3, H * .2, H * 1.6);

	}

	// ---- leatherworking (as Effects.lua): tooled panels apart by the gaps still open, laced shut joint by joint
	makeLeather() {
		const H = settings.H, W = settings.W, joints = [], tints = [], ys = [];
		toolingTurn = (toolingTurn + 1) % 5;
		const rows = H >= 34 ? 5 : 4;
		for (let x = H * rand(1.3, 2); x < W - H * .9 && joints.length < 20; x += H * rand(1.8, 3)) joints.push(x);
		for (let i = 0; i <= joints.length; i++) tints.push(rand(-.14, .12));
		for (let r = 0; r < rows; r++) ys.push(H * (.18 + .64 * r / (rows - 1)));   // the lacing rows, y down
		this.leather = { tone: pick(TONES), thread: pick(THREADS), thong: pick(THONGS), rows, joints, tints, ys, tool: toolingTurn + 1 };
		this.lwTool = null;
	}
	drawLeatherFill(og, fillW, H) {
		const s = this.leather, W = settings.W, J = s.joints, rows = s.rows, ys = s.ys;
		const lp = j => clamp01((fillW - J[j]) / (H * .9)), openG = j => H * .14 * (1 - easeOut(lp(j)));
		og.fillStyle = 'rgba(12,7,4,.96)'; og.fillRect(0, 0, W, H);
		const lea = tinted('lw_leather', q8(s.tone.map(v => Math.min(255, v / LEATHER_NOM)))), tool = imgs['lw_tool' + s.tool];
		const hole = imgs.p_hole, edge = tinted('edge_h', [36, 18, 6]);
		let off = 0; const offs = [];
		for (let p = 0; p <= J.length; p++) {
			const a = p ? J[p - 1] : 0, b = p < J.length ? J[p] : W, x0 = a + off, w = b - a;
			offs.push(off);
			og.save(); og.beginPath(); og.rect(x0, 0, w, H); og.clip();
			for (let tx = off - (a % (8 * H)) - 8 * H; tx < x0 + w; tx += 8 * H) if (tx + 8 * H > x0) og.drawImage(lea, tx, 0, 8 * H, H);   // its stretch of the tiling hide
			const v = s.tints[p];
			og.fillStyle = v > 0 ? `rgba(255,238,214,${v})` : `rgba(30,14,4,${-v})`; og.fillRect(x0, 0, w, H);
			const ix0 = x0 + (p ? H * .24 : H * .18), ix1 = x0 + w - (p < J.length ? H * .24 : H * .18);
			if (ix1 - ix0 > H * .4) {   // the tooling, in the middle band, clear of the holes and the edge stitching
				og.save(); og.beginPath(); og.rect(ix0, H * .15, ix1 - ix0, H * .7); og.clip();
				for (let tx = ix0; tx < ix1; tx += 2 * H) og.drawImage(tool, 0, 128 * .15, 256, 128 * .7, tx, H * .15, 2 * H, H * .7);
				og.restore();
			}
			og.globalAlpha = .7;
			if (p) { og.save(); og.translate(x0 + H * .08, 0); og.scale(-1, 1); og.drawImage(edge, 0, 0, H * .08, H); og.restore(); }
			if (p < J.length) og.drawImage(edge, x0 + w - H * .08, 0, H * .08, H);
			og.globalAlpha = 1;
			for (let r = 0; r < rows; r++) {
				if (p) og.drawImage(hole, x0 + H * .05, ys[r] - H * .05, H * .1, H * .1);
				if (p < J.length) og.drawImage(hole, x0 + w - H * .15, ys[r] - H * .05, H * .1, H * .1);
			}
			og.restore();
			if (p < J.length) off += openG(p);
		}
		const sh = og.createLinearGradient(0, 0, 0, H);
		sh.addColorStop(0, 'rgba(255,240,220,.1)'); sh.addColorStop(.3, 'rgba(255,240,220,0)'); sh.addColorStop(1, 'rgba(0,0,0,.18)');
		og.fillStyle = sh; og.fillRect(0, 0, W, H);
		// running stitches along both long edges, behind the work
		let done = fillW - H * .2;
		for (let j = 0; j < J.length; j++) if (lp(j) < 1) { done = Math.min(done, J[j] + offs[j]); break; }
		if (done > 1) {
			const st = tinted('lw_stitch', s.thread);
			for (const y of [H * .07, H * .93]) {
				og.save(); og.beginPath(); og.rect(0, y - H * .05, done, H * .1); og.clip();
				for (let x = 0; x < done; x += H * .2) og.drawImage(st, x, y - H * .05, H * .2, H * .1);
				og.restore();
			}
		}
		// the joints: the needle cross-laces each shut as the cast reaches it
		this.lwTool = null;
		const segs = (rows - 1) * 2, lw = Math.max(1.4, H * .06);
		og.lineCap = 'round';
		for (let j = 0; j < J.length; j++) {
			const f0 = lp(j);
			if (f0 <= 0) continue;
			const L = J[j] + offs[j], R = L + openG(j), xl = L - H * .1, xr = R + H * .1, n = f0 * segs;
			for (let q = 0; q < Math.min(segs, Math.ceil(n)); q++) {
				const r = Math.floor(q / 2), f = Math.min(1, n - q);
				const [x1, y1, x2, y2] = q % 2 === 0 ? [xl, ys[r], xr, ys[r + 1]] : [xr, ys[r], xl, ys[r + 1]];
				const ex = x1 + (x2 - x1) * f, ey = y1 + (y2 - y1) * f;
				og.strokeStyle = rgba(s.thong, 1); og.lineWidth = lw;
				og.beginPath(); og.moveTo(x1, y1); og.lineTo(ex, ey); og.stroke();
				og.strokeStyle = rgba(lighter(s.thong, .5), .45); og.lineWidth = lw * .3;
				og.beginPath(); og.moveTo(x1, y1 - lw * .25); og.lineTo(ex, ey - lw * .25); og.stroke();
				if (f < 1) this.lwTool = { x: ex, y: ey, dx: x2 - x1, dy: y2 - y1 };
			}
		}
	}
	// over the frame line: the needle at the lace's end, in the nearest painted pose, flipped for down-left
	drawLeatherTools(g, ox, oy, fillW, H) {
		const T = this.lwTool;
		if (!T || this.state !== 'cast') return;
		const d = Math.hypot(T.dx, T.dy) || 1, ux = T.dx / d, uy = T.dy / d, ex = T.x - ux * H * .08, ey = T.y - uy * H * .08;
		const ang = Math.atan(Math.abs(uy) / Math.max(.01, Math.abs(ux)));
		const pose = Math.max(0, Math.min(NEEDLE.poses - 1, Math.round((ang - NEEDLE.ang[0]) / (NEEDLE.ang[NEEDLE.poses - 1] - NEEDLE.ang[0]) * (NEEDLE.poses - 1))));
		const cell = imgs.p_needle.width / 2, sx = (pose % 2) * cell + .5, sy = Math.floor(pose / 2) * cell + .5;
		g.save(); g.translate(ox + ex, oy + ey); if (ux < 0) g.scale(-1, 1);
		g.drawImage(imgs.p_needle, sx, sy, cell - 1, cell - 1, -NEEDLE.ox * H, -NEEDLE.oy * H, NEEDLE.span * H, NEEDLE.span * H);
		g.restore();
	}

	// ---- plain (as Effects.lua): Blizzard's cast bar; a stand-in here, since the browser can't load Blizzard's atlases
	drawPlainFill(og, fillW, H) {
		const ch = this.cur.plain === 'channel', done = this.state === 'done', broken = this.state === 'interrupted';
		const gr = og.createLinearGradient(0, 0, 0, H);
		const c = broken ? [[220, 60, 50], [150, 20, 15]] : ch ? [[110, 230, 90], [30, 140, 30]] : [[255, 215, 70], [205, 120, 10]];
		const k = done ? .25 : 0;
		gr.addColorStop(0, rgba(c[0].map(v => v + (255 - v) * k), 1)); gr.addColorStop(.5, rgba(c[1].map(v => v + (255 - v) * k), 1)); gr.addColorStop(1, rgba(c[1].map(v => v * .8), 1));
		og.fillStyle = gr; og.fillRect(0, 0, fillW, H);
		og.fillStyle = 'rgba(255,255,255,.25)'; og.fillRect(0, H * .1, fillW, Math.max(1, H * .12));
	}

	// ---- herbalism: flowers bloom on the vines (drawn with the leaves)
	addFlower(v, x, y) {
		v.leaves.push({ x, y, flower: true, size: settings.H * rand(.35, .55), born: this.clock, d: Math.cos(v.ph), tint: pick(FLOWER_TINTS), rot: rand(0, 6.283) });
	}

	// light catching the ice: a soft diagonal band sweeps across at random moments
	drawSweep(g, fillW, H, dt) {
		this.sweepT -= dt;
		if (!this.sweep && this.sweepT <= 0) this.sweep = { t: 0, dur: rand(.45, .8) };
		if (!this.sweep) return;
		this.sweep.t += dt;
		const p = this.sweep.t / this.sweep.dur;
		if (p >= 1) { this.sweep = null; this.sweepT = rand(1.2, 3.5); return; }
		const x = -H + (fillW + 2 * H) * p;
		g.save(); g.globalCompositeOperation = 'lighter';
		g.transform(1, 0, -.6, 1, H * .3, 0);   // lean the band
		const gr = g.createLinearGradient(x - H * .5, 0, x + H * .5, 0);
		gr.addColorStop(0, 'rgba(200,235,255,0)'); gr.addColorStop(.5, 'rgba(220,245,255,.55)'); gr.addColorStop(1, 'rgba(200,235,255,0)');
		g.fillStyle = gr; g.fillRect(x - H * .5, 0, H, H);
		g.restore();
	}

	// ---- particles
	// ---- enchanting / disenchant (as Effects.lua): the velvet tinted to a palette, the flow, glitter, the vortex and its dust
	makeEnch() {
		const H = settings.H, W = settings.W, pal = pick(ENCH_PALETTES), dis = !!this.cfg.ench.disenchant;
		const top = q8(pal.deep.map((v, i) => Math.min(255, (v + (pal.main[i] - v) * .18) / VELVET_NOM)));
		this.layerTints = [top, q8(pal.main.map((v, i) => (v + pal.acc[i]) / 2))];
		const s = this.ench = { pal, dis, top, flowU: [Math.random(), Math.random()], glitter: [], dust: [], pull: [], thrown: [], ash: [], pullAcc: 0 };
		for (let i = 0; i < Math.min(40, Math.floor(W / H * 10)); i++) s.glitter.push({ x: rand(0, W), y: H * rand(.1, .9), f: rand(2, 6), ph: rand(0, 6.283), r: rand(.02, .045) });
		if (dis) for (let i = 0; i < Math.min(24, Math.floor(W / H * 8)); i++) s.ash.push({ x: rand(0, W), y: H * rand(.1, .9), f: rand(1, 3), ph: rand(0, 6.283), r: rand(.015, .03) });
		else for (let i = 0; i < Math.min(48, Math.floor(W / H * 8)); i++) s.dust.push(this.newDust(rand(0, W)));
	}
	newDust(x) { const H = settings.H; return { x, y: H * rand(.1, .9), ang: rand(0, 6.283), r: rand(.025, .05), f: rand(2, 6), ph: rand(0, 6.283) }; }
	// the vortex's centre: it leads the cast edge a little, and over the last .6 bar heights pulls a whole bar height ahead,
	// so by completion it has passed the bar's end and the clip (drawEnchTools) has cut it all away (as Effects_Ench.lua)
	enchVx(fillW) {
		const W = settings.W, H = settings.H, lead = H * (.15 + .85 * clamp01((fillW - (W - H * .6)) / (H * .6)));
		return this.ench.dis ? W - fillW - lead : fillW + lead;
	}
	// inside the bar: the flow's two bands and the glitter; disenchant: the spent cloth behind the vortex, the ash
	drawEnchFill(og, fillW, H, dt) {
		const s = this.ench, W = settings.W, pal = s.pal, vx = this.enchVx(fillW), drain = ENCH_DRAIN * H;
		const fresh = x => s.dis ? clamp01((vx - x) / drain) ** 1.4 : 1;
		const strip = s.dis ? Math.max(2, H * .2) : W;
		og.save(); og.globalCompositeOperation = 'lighter';
		for (let k = 0; k < 2; k++) {   // the flow: band k's texture is ENCH_FLOW[k].w bar heights wide, sliding right
			const F = ENCH_FLOW[k];
			s.flowU[k] = (((s.flowU[k] - F.su * dt) % 1) + 1) % 1;
			const img = tinted('ench_flow' + (k + 1), k ? pal.acc : pal.main), tw = F.w * H;
			for (let sx = 0; sx < (s.dis ? vx : W); sx += strip) {
				const a = .2 * fresh(sx + strip / 2);
				if (a <= .005) continue;
				og.save(); og.beginPath(); og.rect(sx, 0, Math.min(strip, W - sx) + .5, H); og.clip(); og.globalAlpha = a;
				for (let x = -s.flowU[k] * tw; x < W; x += tw) og.drawImage(img, x, 0, tw, H);
				og.restore();
			}
		}
		const upTo = s.dis ? vx - drain * .3 : fillW, gl = tinted('p_soft', pal.hi);   // glitter behind the edge / well ahead of the vortex
		for (const q of s.glitter) {
			if (q.x > upTo) continue;
			const sz = H * q.r * 6.6;
			og.globalAlpha = Math.max(0, Math.sin(this.clock * q.f + q.ph)) ** 3 * .8; og.drawImage(gl, q.x - sz / 2, q.y - sz / 2, sz, sz);
		}
		og.restore();
		if (!s.dis) return;
		// the spent cloth behind the vortex: the velvet drained of colour and darkened, fading in over the drain stretch
		const lum = Math.round((s.top[0] * .3 + s.top[1] * .59 + s.top[2] * .11) * .55), spent = tinted('ench_velvet', q8([lum, lum, lum]));
		const dpr = window.devicePixelRatio || 1, k = H * dpr / 64;
		og.save(); og.setTransform(1, 0, 0, 1, 0, 0);
		og.fillStyle = pattern(og, scaled('ench_velvet|spent' + lum, k, spent), this.layerOff[0].u, 0);
		for (let sx = Math.max(0, vx - drain); sx < W; sx += strip) {
			const w = Math.min(strip, W - sx);
			og.globalAlpha = 1 - fresh(sx + w / 2); og.fillRect(sx * dpr, 0, (w + .5) * dpr, H * dpr);
		}
		og.restore();
		og.save(); og.globalCompositeOperation = 'lighter';
		const ash = tinted('p_soft', [190, 190, 200]);   // a last few dull glints in the spent part
		for (const q of s.ash) {
			if (q.x < vx + drain * .5) continue;
			const sz = H * q.r * 6.6;
			og.globalAlpha = Math.max(0, Math.sin(this.clock * q.f + q.ph)) ** 4 * .25; og.drawImage(ash, q.x - sz / 2, q.y - sz / 2, sz, sz);
		}
		og.restore(); og.globalAlpha = 1;
	}
	// over the bar, clipped to it: enchanting's dust pulled into the vortex; disenchant's motes drawn out and the dust thrown behind
	drawEnchDust(g, ox, oy, fillW, H, dt) {
		const s = this.ench, W = settings.W, pal = s.pal, vx = this.enchVx(fillW), vy = H * .5, casting = this.state === 'cast', t = this.clock;
		g.save(); g.beginPath(); g.rect(ox, oy, W, H); g.clip(); g.globalCompositeOperation = 'lighter';
		const glow = tinted('p_soft', pal.main), glowAcc = tinted('p_soft', pal.acc), dot = tinted('p_dot', pal.hi);
		const mote = (x, y, r, near, a) => {
			const gs = H * r * 5.6, ds = H * r * 1.2;
			g.globalAlpha = a * .6; g.drawImage(near > .3 ? glowAcc : glow, ox + x - gs / 2, oy + y - gs / 2, gs, gs);
			g.globalAlpha = a; g.drawImage(dot, ox + x - ds / 2, oy + y - ds / 2, ds, ds);
		};
		if (!s.dis) {
			for (const d of s.dust) {
				const dx = d.x - vx, dist = Math.max(H * .2, Math.abs(dx)), pull = casting ? H * 2.8 / (dist / H + .4) : 0;
				if (dx > 0) d.x -= pull * dt;
				d.ang += dt * (2 + 9 / (dist / H + .3));
				const near = clamp01(1 - dist / (H * 1.6)), y = d.y + (vy + Math.sin(d.ang) * H * .38 * (1 - near * .4) - d.y) * near;
				mote(d.x, y, d.r, near, .25 + .55 * near * (.5 + .5 * Math.sin(t * d.f + d.ph)));
				if (d.x < vx - H * .05) Object.assign(d, this.newDust(rand(Math.max(vx + H * .5, 0), W + H * .3)));
			}
		} else {
			const drain = ENCH_DRAIN * H;
			if (casting && vx > H * .3) {
				s.pullAcc += dt * 34;
				while (s.pullAcc >= 1) {
					s.pullAcc--;
					if (s.pull.length < 36) s.pull.push({ x: rand(Math.max(0, vx - drain), vx - H * .15), y: H * rand(.12, .88), ang: rand(0, 6.283), r: rand(.025, .05), f: rand(2, 6), ph: rand(0, 6.283) });
				}
			} else s.pullAcc = 0;
			for (let i = s.pull.length - 1; i >= 0; i--) {   // motes drawn out of the drain stretch, spiralling into the vortex
				const d = s.pull[i], dist = Math.max(H * .15, Math.abs(vx - d.x));
				d.x += H * 2.6 / (dist / H + .35) * dt; d.ang -= dt * (2 + 9 / (dist / H + .3));
				const near = clamp01(1 - dist / (H * 1.6)), y = d.y + (vy + Math.sin(d.ang) * H * .38 * (1 - near * .4) - d.y) * near;
				mote(d.x, y, d.r, near, .35 + .55 * near);
				if (d.x >= vx - H * .05 || !casting) {
					s.pull.splice(i, 1);
					if (casting) {   // out of the throat and flung behind: dust, a third of it shimmers (no essence orbs)
						if (s.thrown.length >= 110) s.thrown.shift();
						const shine = Math.random() < .35;
						s.thrown.push({ x: vx + H * .1, y: vy + rand(-.15, .15) * H, vx: H * rand(1.4, 3.6), vy: H * rand(-1.2, 1.2), rest: H * rand(.15, .85), r: rand(.02, .045), f: shine ? rand(1.2, 3) : rand(2, 6), ph: rand(0, 6.283), shine, c: Math.random() < .5 });
					}

				if (!q.settled) {

					q.x += q.vx * dt; q.y += q.vy * dt;

					if (Math.abs(q.vx) < H * .01 && Math.abs(q.vy) < H * .01 && Math.abs(q.rest - q.y) < H * .01) q.settled = true;
				}
				const tw = .45 + .55 * Math.max(0, Math.sin(t * q.f + q.ph));

	// over the frame line: the vortex, only while casting (the glow, the rings' atlas cells for this moment's spin, the white throat)
	drawEnchTools(g, ox, oy, fillW, H) {
		const s = this.ench, pal = s.pal;
		if (this.state !== 'cast' || fillW < 2) return;
		const vx = ox + this.enchVx(fillW), vy = oy + H * .5, cell = VORTEX.cell * H;
		g.save(); g.beginPath(); g.rect(ox, oy, settings.W, H); g.clip();   // the addon's clip frame: nothing past the bar
		g.globalCompositeOperation = 'lighter';
		g.globalAlpha = .35; g.drawImage(tinted('p_soft', pal.main), vx - H, vy - H, H * 2, H * 2);
		const ring = [tinted('p_vortex', pal.hi), tinted('p_vortex', pal.acc)];
		for (let i = 0; i < VORTEX.rows; i++) {
			const col = Math.floor(((this.clock * (3 + i * 1.6) / 6.283) % 1) * VORTEX.cols);
			g.globalAlpha = .2 + .5 * i / 5;
			g.save(); g.translate(vx, vy); if (s.dis) g.scale(-1, 1);   // mirrored: leaning and spinning the other way
			g.drawImage(ring[i % 2], col * VORTEX.px, i * VORTEX.px, VORTEX.px, VORTEX.px, -cell / 2, -cell / 2, cell, cell);
			g.restore();

		g.restore(); g.globalAlpha = 1; g.globalCompositeOperation = 'source-over';
	}

	spawn(e, x, y) {
		const H = settings.H, k = H / 28;
		this.parts.push({
			x, y, vx: rand(...e.vx) * k, vy: rand(...e.vy) * k, life: rand(...e.life), age: 0,
			size: rand(...e.size) * H, rot: rand(0, 6.28), spin: rand(...e.spin), e, color: pick(e.color),
			tw: e.twinkle ? rand(8, 16) : 0, sw: e.swirl ? rand(0, 6.28) : 0, grow: e.grow ? rand(...e.grow) * H : 0,
		});
	}
	emit(dt, fillW, H) {
		(this.cur || this.cfg).emit.forEach((e, i) => {
			this.emitAcc[i] += e.rate * dt * (fillW > 2 ? 1 : 0);
			while (this.emitAcc[i] >= 1) {
				this.emitAcc[i]--;
				let x, y;
				if (e.from === 'edge') { x = fillW + rand(-4, 1); y = rand(0, H); }
				else if (e.from === 'bottom') { x = rand(0, fillW); y = H * rand(.35, 1); }
				else if (e.from === 'top') { x = rand(0, fillW); y = H * rand(0, .3); }   // embers carrying on off the top
				else { x = rand(0, fillW); y = rand(0, H); }
				this.spawn(e, x, y);
			}
		});
	}
	drawParts(g, ox, oy, dt) {
		this.parts = this.parts.filter(p => (p.age += dt) < p.life);
		for (const p of this.parts) {
			if (p.e.swirl) p.vx += Math.sin(p.age * 6 + p.sw) * p.e.swirl * dt;
			if (p.e.gravity) p.vy += p.e.gravity * settings.H / 28 * dt;
			p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.spin * dt; p.size += p.grow * dt;   // steam spreads as it rises
			const t = p.age / p.life;
			let a = Math.min(1, t / .15) * Math.min(1, (1 - t) / .4) * p.e.alpha;
			if (p.tw) a *= .5 + .5 * Math.sin(p.age * p.tw);
			g.globalAlpha = clamp01(a);
			g.globalCompositeOperation = p.e.add ? 'lighter' : 'source-over';
			g.save(); g.translate(ox + p.x, oy + p.y); g.rotate(p.rot);
			g.drawImage(tinted(p.e.t, p.color), -p.size / 2, -p.size / 2, p.size, p.size);
			g.restore();
		}
		g.globalAlpha = 1; g.globalCompositeOperation = 'source-over';
	}

	// ---- arcane rune circles: placed at random heights and sizes as the bar fills, held still and
	// randomly mirrored (turning made them shimmer in game)
	drawCircles(g, fillW, H, dt) {
		while (fillW > this.circleNext) {
			this.circles.push({ x: this.circleNext, y: H * rand(.1, .9), s: H * rand(1.0, 2.3), i: Math.floor(rand(0, 3)), fx: Math.random() < .5 ? -1 : 1, fy: Math.random() < .5 ? -1 : 1,
				born: this.clock, c: pick([[255, 175, 235], [175, 205, 255], [215, 175, 255]]), ph: rand(0, 6.283) });
			this.circleNext += H * rand(1.3, 3.0);
		}
		g.globalCompositeOperation = 'lighter';
		for (const q of this.circles) {
			if (q.x - q.s / 2 > fillW) continue;
			g.globalAlpha = Math.min(1, (this.clock - q.born) / .5) * (.75 + .2 * Math.sin(this.clock * 1.3 + q.ph));
			g.save(); g.translate(q.x, q.y); g.scale(q.fx, q.fy);
			g.drawImage(tinted('p_runecircles', q.c), q.i * 128, 0, 128, 128, -q.s / 2, -q.s / 2, q.s, q.s);
			g.restore();
		}
		g.globalAlpha = 1; g.globalCompositeOperation = 'source-over';
	}

	// ---- arcane glyphs that flare up inside the bar and fade
	drawGlyphs(g, fillW, H, dt) {
		this.glyphT -= dt;
		if (this.glyphT <= 0 && fillW > H) {
			this.glyphT = rand(.25, .6);
			this.glyphs.push({ x: rand(H * .3, fillW - H * .2), y: H / 2 + rand(-.12, .12) * H, s: H * rand(.6, .95), age: 0, life: rand(.9, 1.7),
				i: Math.floor(rand(0, 16)), c: pick([[255, 150, 230], [140, 200, 255], [255, 215, 140]]), fx: Math.random() < .5 ? -1 : 1, fy: Math.random() < .5 ? -1 : 1 });
		}
		this.glyphs = this.glyphs.filter(q => (q.age += dt) < q.life && q.x < fillW);
		g.globalCompositeOperation = 'lighter';
		for (const q of this.glyphs) {
			const t = q.age / q.life, a = Math.sin(Math.PI * t) ** 1.5, s = q.s * (.75 + .25 * easeOutBack(clamp01(t * 2.5)));
			g.globalAlpha = a;
			g.save(); g.translate(q.x, q.y); g.scale(q.fx, q.fy);
			g.drawImage(tinted('p_glyphs', q.c), (q.i % 8) * 64, Math.floor(q.i / 8) * 64, 64, 64, -s / 2, -s / 2, s, s);
			g.restore();
		}
		g.globalAlpha = 1; g.globalCompositeOperation = 'source-over';
	}

	// ---- holy twinkles: sharp four-point stars that pop in and out, some spilling past the edges
	drawTwinkles(g, ox, oy, fillW, H, dt) {
		this.twinkleAcc += dt * 9;
		while (this.twinkleAcc >= 1 && fillW > 4) {
			this.twinkleAcc--;
			const big = Math.random() < .15;
			this.twinkles.push({ x: rand(0, fillW), y: rand(-.25, 1.25) * H, s: H * (big ? rand(.9, 1.4) : rand(.35, .7)), age: 0, life: rand(.4, 1.1),
				c: pick([[255, 245, 215], [255, 225, 150], [255, 255, 255]]), rot: rand(-.3, .3) });
		}
		this.twinkles = this.twinkles.filter(q => (q.age += dt) < q.life);
		g.globalCompositeOperation = 'lighter';
		for (const q of this.twinkles) {
			const t = q.age / q.life, a = Math.sin(Math.PI * t) ** 2, s = q.s * (.6 + .4 * Math.sin(Math.PI * t));
			g.globalAlpha = a;
			g.save(); g.translate(ox + q.x, oy + q.y); g.rotate(q.rot + t * .4);
			g.drawImage(tinted('p_twinkle', q.c), -s / 2, -s / 2, s, s);
			g.restore();
		}
		g.globalAlpha = 1; g.globalCompositeOperation = 'source-over';
	}

	frame(dt) {
		const { W, H } = settings;
		// a channel drains, so some looks swap to a reversed version (frost freezes the other way)
		const cfg = (settings.mode === 'channel' && this.cfg.channelLook) ? EL[this.cfg.channelLook] : this.cfg;
		this.cur = cfg;
		const PAD = Math.round(H * 0.9), PT = Math.round(H * (cfg.padTop || .9));   // looks with tools held above the bar need more room on top
		const dpr = window.devicePixelRatio || 1;
		const cw = W + PAD * 2, ch = H + PAD + PT;
		if (this.cv.width !== cw * dpr || this.cv.height !== ch * dpr) {
			this.cv.width = cw * dpr; this.cv.height = ch * dpr; this.cv.style.width = cw + 'px'; this.cv.style.height = ch + 'px';
			this.off.width = W * dpr; this.off.height = H * dpr;
		}
		this.clock += dt;
		// cast state
		if (this.state === 'cast') {
			this.elapsed += dt;
			if (settings.freeze) this.elapsed = Math.min(this.elapsed, settings.hold * this.dur);
			if (this.elapsed >= this.dur) { this.state = 'done'; this.stateT = 0; }
		} else {
			if (!this.hold) this.stateT += dt;   // (?done= / ?interrupted= hold the ending still)
			const total = this.state === 'done' ? .9 : 1.2;
			this.cv.style.opacity = this.stateT < total - .5 ? 1 : clamp01((total - this.stateT) / .5);
			if (this.stateT > total + .4) this.newCast();
		}
		const p = clamp01(this.elapsed / this.dur);
		const channel = settings.mode === 'channel' || !!cfg.channel;   // Fishing always drains, like the real channel
		const fillW = W * (channel ? 1 - p : p);

		const g = this.g, og = this.og;
		g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, cw, ch);
		og.setTransform(dpr, 0, 0, dpr, 0, 0); og.clearRect(0, 0, W, H);

		// outer glow behind the filled part
		const ga = .30 + .12 * this.glowWob(this.clock);
		if (cfg.glow.some(v => v > 0)) {   // (alchemy and plain have none)
			g.save(); g.shadowColor = rgba(cfg.glow, ga * 1.4); g.shadowBlur = H * .9; g.fillStyle = rgba(cfg.glow, ga * .35);
			if (fillW > 1) g.fillRect(PAD + 2, PT + 3, fillW - 4, H - 6);
			g.restore();
		}

		// empty track (layers are drawn in device pixels so the patterns are never rescaled)
		og.fillStyle = 'rgba(6,6,10,.85)'; og.fillRect(0, 0, W, H);
		og.setTransform(1, 0, 0, 1, 0, 0);
		const k = H * dpr / 64, DW = W * dpr, DH = H * dpr, DF = fillW * dpr;
		if (cfg.track) {
			// this element's own track: what lies ahead of the cast (flowing water, a pond, dim rails)
			const T = cfg.track;
			this.trackU += (T.su || 0) * dt * settings.speed; this.trackU2 += (T.su2 || 0) * dt * settings.speed;
			// a look can tint its track per cast (skinning: the next pelt; tailoring: the cloth), like ns.TintTrack
			const tt = (cfg.skin || cfg.tailor) && this.trackTint;
			const trackTex = tt ? scaled(T.t + '|' + tt.fur, k, tinted(T.t, tt.fur)) : scaled(T.t, k);
			og.globalAlpha = T.a; og.fillStyle = pattern(og, trackTex, this.trackU, 0); og.fillRect(0, 0, DW, DH);
			if (T.hi) {
				const hiTex = tt ? scaled(T.hi + '|' + tt.tips, k, tinted(T.hi, tt.tips)) : scaled(T.hi, k);
				og.globalCompositeOperation = 'lighter'; og.globalAlpha = T.hiA || .8; og.fillStyle = pattern(og, hiTex, this.trackU2, 0); og.fillRect(0, 0, DW, DH); og.globalCompositeOperation = 'source-over';
			}
			og.globalAlpha = 1;
		} else if (cfg.plain) {
			og.fillStyle = 'rgba(24,18,10,.85)'; og.fillRect(0, 0, DW, DH);   // stands in for Blizzard's ui-castingbar-background
		} else {
			og.globalAlpha = .16; og.fillStyle = pattern(og, scaled(cfg.layers[0].t, k), this.layerOff[0].u, 0); og.fillRect(0, 0, DW, DH); og.globalAlpha = 1;
		}

		// filled part (alchemy's trough is the whole bar: its liquid's level is the progress)
		const DC = cfg.wholeBar ? DW : DF;
		// the clip edge on a whole pixel, as the addon's clip frame: a fractional edge is antialiased, and every layer drawn through
		// it only half-covers that column, so a dark cap over hot metal left a faint light line at the fill edge (smelting)
		og.save(); og.beginPath(); og.rect(0, 0, Math.round(DC), DH); og.clip();
		og.fillStyle = 'rgba(0,0,0,1)'; og.fillRect(0, 0, DC, DH);
		cfg.layers.forEach((L, i) => {
			const sm = 1 + .45 * this.speedWob[i](this.clock);       // speed drifts, so the scroll never settles into a loop
			const o = this.layerOff[i];
			o.u += (L.su || 0) * sm * dt * settings.speed; o.v += (L.sv || 0) * dt * settings.speed * (1 + .3 * this.speedWob[i](this.clock + 9));
			let a = 1;
			if (L.a) a = L.a[0] + (L.a[1] - L.a[0]) * (.5 + .5 * this.wob[i](this.clock * (L.flicker ? 6 : 1)));
			og.globalAlpha = a; og.globalCompositeOperation = L.add ? 'lighter' : 'source-over';
			const lt = cfg.tailor ? (i === 0 && this.layerTint) : cfg.ench ? this.layerTints[i] : null;   // tailoring tints its cloth per cast, enchanting its velvet (Effects_Tailor.lua MakeTailor, Effects_Ench.lua MakeEnch)
			og.fillStyle = pattern(og, lt ? scaled(L.t + '|' + lt, k, tinted(L.t, lt)) : scaled(L.t, k), o.u, o.v); og.fillRect(0, 0, DC, DH);
		});
		// veil: soft tinted shimmer
		og.globalCompositeOperation = 'lighter'; og.globalAlpha = .35 + .2 * this.glowWob(this.clock + 3);
		og.fillStyle = pattern(og, scaled('veil:' + this.key, k * 2, tinted('veil', cfg.veil)), this.clock * .015 * settings.speed, 0);
		og.fillRect(0, 0, DC, DH);
		og.globalAlpha = 1; og.globalCompositeOperation = 'source-over';
		og.setTransform(dpr, 0, 0, dpr, 0, 0);
		if (cfg.glyphs) { this.drawCircles(og, fillW, H, dt); this.drawGlyphs(og, fillW, H, dt); }
		if (cfg.sweep) this.drawSweep(og, fillW, H, dt * settings.speed);
		if (cfg.freeze) this.drawFreeze(og, fillW, H);
		if (cfg.skin) this.drawSkinMeat(og, fillW, H);
		if (cfg.smith) this.drawSmithFill(og, fillW, H);
		if (cfg.smelt) this.drawSmeltFill(og, fillW, H);
		if (cfg.storm) this.drawStormFill(og, fillW, H, dt * settings.speed);
		if (cfg.alchemy) this.drawAlchFill(og, fillW, H, dt * settings.speed);
		if (cfg.tailor) this.drawTailorFill(og, fillW, H, dt * settings.speed);
		if (cfg.leather) this.drawLeatherFill(og, fillW, H);
		if (cfg.ench) this.drawEnchFill(og, fillW, H, dt * settings.speed);
		if (cfg.plain) this.drawPlainFill(og, fillW, H);
		og.restore();
		og.setTransform(dpr, 0, 0, dpr, 0, 0);
		if (cfg.freezeReverse) this.drawFreezeReverse(og, fillW, H);   // outside the fill's clip, over the ice
		if (cfg.tailor) this.drawShed(og, fillW, H);                   // on the track past the fell

		// interrupted: drain the colour out
		if (this.state === 'interrupted') {
			og.globalCompositeOperation = 'saturation'; og.fillStyle = 'hsl(0,0%,50%)'; og.fillRect(0, 0, W, H);
			og.globalCompositeOperation = 'multiply'; og.fillStyle = 'rgb(255,110,110)'; og.fillRect(0, 0, W, H);
			og.globalCompositeOperation = 'source-over';
		}
		// finished: a bright flash that fades
		if (this.state === 'done') {
			og.globalCompositeOperation = 'lighter'; og.globalAlpha = clamp01(1 - this.stateT / .35) * (cfg.flashAlpha ?? .8);   // (Bar.lua: flashAlpha keeps some looks calm)
			og.fillStyle = rgba(cfg.spark, 1); og.fillRect(0, 0, W, H);
			og.globalAlpha = 1; og.globalCompositeOperation = 'source-over';
		}

		// the bar's shape: its corners (the addon's corner masks on every texture that reaches the edges), and the
		// bevel laid over the fill (Bar.lua LayoutShape)
		const rr = CORNER_R[settings.corners] * H;
		g.save(); roundRectPath(g, PAD, PT, W, H, rr); g.clip();
		g.drawImage(this.off, PAD, PT, W, H);
		if (settings.depth === 'bevel') {
			let gr = g.createLinearGradient(0, PT, 0, PT + H * .35); gr.addColorStop(0, 'rgba(255,255,255,.28)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
			g.fillStyle = gr; g.fillRect(PAD, PT, W, H * .35);
			gr = g.createLinearGradient(0, PT + H * .6, 0, PT + H); gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(1, 'rgba(0,0,0,.5)');
			g.fillStyle = gr; g.fillRect(PAD, PT + H * .6, W, H * .4);
			const s = H * .12;
			for (const [x0, y0, x1, y1, rx, ry, rw, rh] of [[0, PT, 0, PT + s, PAD, PT, W, s], [0, PT + H, 0, PT + H - s, PAD, PT + H - s, W, s],
				[PAD, 0, PAD + s, 0, PAD, PT, s, H], [PAD + W, 0, PAD + W - s, 0, PAD + W - s, PT, s, H]]) {
				gr = g.createLinearGradient(x0, y0, x1, y1); gr.addColorStop(0, 'rgba(0,0,0,.35)'); gr.addColorStop(1, 'rgba(0,0,0,0)');
				g.fillStyle = gr; g.fillRect(rx, ry, rw, rh);
			}
		}
		g.restore();

		if (settings.style !== 'borderless') {   // the frame line; borderless leaves it out (edges stay clean either way)
			// as the addon: the dark line .1 of the bar's height with 2/3 of it outside, the lit line half that, inside it; both follow the corners
			const td = H * .1, tl = td / 2, e = td * 2 / 3;
			roundRectPath(g, PAD - e + td / 2, PT - e + td / 2, W + 2 * e - td, H + 2 * e - td, rr + e - td / 2);
			g.strokeStyle = 'rgba(0,0,0,.8)'; g.lineWidth = td; g.stroke();
			roundRectPath(g, PAD - tl / 2, PT - tl / 2, W + tl, H + tl, rr + tl / 2);
			g.strokeStyle = rgba(cfg.plain ? [190, 160, 100] : cfg.border, 1); g.lineWidth = tl; g.stroke();   // plain: Blizzard's gold frame
		}
		// live elements drawn over the bar and its frame line (the addon's fx frame, above the border): free to spill past the edges
		if (cfg.ench) this.drawEnchDust(g, PAD, PT, fillW, H, dt * settings.speed);   // (clipped to the bar, as the addon's frame)
		if (cfg.pond) this.drawPond(g, PAD, PT, fillW, H, dt * settings.speed);
		if (cfg.mine) this.drawMine(g, PAD, PT, fillW, H, dt * settings.speed);
		if (cfg.skin) this.drawSkinAhead(g, PAD, PT, fillW, H);
		if (cfg.smith) this.drawSmithFx(g, PAD, PT, fillW, H, dt * settings.speed);
		if (cfg.smelt) this.drawSmeltFx(g, PAD, PT, fillW, H, dt * settings.speed);
		if (this.vines) { if (this.state === 'cast') this.growVines(fillW, H); this.drawVines(g, PAD, PT, fillW, H); }
		if (cfg.twinkles) this.drawTwinkles(g, PAD, PT, fillW, H, dt * settings.speed);

		if (DEBUG) { g.fillStyle = 'red'; g.fillRect(PAD + fillW - 1, 0, 2, 8); g.fillStyle = 'lime'; for (const q of this.parts) g.fillRect(PAD + q.x - 1, PT + q.y - 1, 2, 2); }
		// leading-edge spark
		if (this.state === 'cast' && p > 0 && p < 1 && !cfg.noSpark) {   // every look's flare, plain's in gold (no thin Blizzard pip)
			const sa = .75 + .25 * this.sparkWob(this.clock);
			g.globalCompositeOperation = 'lighter'; g.globalAlpha = sa;
			const sw = H * .9, sh = H * 1.7;
			g.drawImage(tinted('spark', cfg.spark), PAD + fillW - sw / 2, PT + H / 2 - sh / 2, sw, sh);
			g.globalAlpha = 1; g.globalCompositeOperation = 'source-over';
		}

		if (this.state === 'cast') this.emit(dt * settings.speed, fillW, H);
		this.drawParts(g, PAD, PT, dt * settings.speed);

		if (cfg.alchemy) this.drawAlchTools(g, PAD, PT, fillW, H, dt * settings.speed);
		// tools held in front of the bar, over its frame line (the addon's tools frame)
		if (cfg.skin) this.drawSkinTools(g, PAD, PT, fillW, H);
		if (cfg.smith) this.drawSmithTools(g, PAD, PT, fillW, H);
		if (cfg.smelt) this.drawSmeltTools(g, PAD, PT, fillW, H, dt * settings.speed);
		if (cfg.tailor) this.drawTailorTools(g, PAD, PT, fillW, H);
		if (cfg.leather) this.drawLeatherTools(g, PAD, PT, fillW, H);
		if (cfg.ench) this.drawEnchTools(g, PAD, PT, fillW, H);

		// text
		const fs = Math.max(10, Math.round(H * .46));
		g.font = `600 ${fs}px Georgia, "Times New Roman", serif`; g.textBaseline = 'middle';
		g.shadowColor = 'rgba(0,0,0,.95)'; g.shadowBlur = 3; g.shadowOffsetY = 1;
		g.fillStyle = '#fff'; g.textAlign = 'left';
		const label = this.state === 'interrupted' ? 'Interrupted' : cfg.spell;
		g.fillText(label, PAD + H * .4, PT + H / 2 + 1);
		if (this.state === 'cast') {
			g.textAlign = 'right';
			g.fillText(Math.max(0, this.dur - this.elapsed).toFixed(1), PAD + W - H * .4, PT + H / 2 + 1);
		}
		g.shadowColor = 'transparent';
	}
}

// ------------------------------------------------------------------ wiring
const bars = [];
function bind() {
	const upd = () => {
		settings.W = +$('w').value; settings.H = +$('h').value; settings.speed = +$('speed').value; settings.style = $('style').value;
		settings.corners = $('corners').value; settings.depth = $('depth').value;
		settings.mode = $('mode').value; settings.freeze = $('freeze').checked; settings.hold = $('hold').value / 100;
		document.body.className = 'bg-' + $('bg').value;
	};
	['style', 'corners', 'depth', 'w', 'h', 'speed', 'mode', 'freeze', 'hold', 'bg'].forEach(id => $(id).addEventListener('input', upd));
	$('interrupt').addEventListener('click', () => bars.forEach(b => b.interrupt()));
	upd();
}

loadAll().then(() => {
	// URL options set the controls, e.g. ?h=40&hold=70&sim=2 (sim: seconds to pre-run, for screenshots)
	const q = new URLSearchParams(location.search);
	for (const id of ['style', 'corners', 'depth', 'w', 'h', 'speed', 'mode', 'hold', 'bg']) if (q.has(id)) $(id).value = q.get(id);
	if (q.has('hold')) $('freeze').checked = true;
	bind();
	const main = $('bars');
	for (const k of Object.keys(EL)) if (!EL[k].hidden && (!q.has('only') || q.get('only').split(',').includes(k))) bars.push(new Bar(k, main));
	for (let i = 0; i < (+q.get('sim') || 0) * 60; i++) for (const b of bars) b.frame(1 / 60);
	// ?done=0.05 (or ?interrupted=0.3): every bar frozen that many seconds into its ending, for screenshots of the completion moment
	for (const how of ['done', 'interrupted']) if (q.has(how)) {
		for (const b of bars) { b.elapsed = how === 'done' ? b.dur : b.elapsed; b.state = how; b.stateT = Math.max(0, +q.get(how) - 1 / 60); b.frame(1 / 60); b.hold = true; }
		settings.freeze = true;
	}
	if (q.has('debug')) document.querySelector('footer').textContent = JSON.stringify({ settings, bars: bars.map(b => [b.key, b.state, +b.elapsed.toFixed(2), +b.dur.toFixed(2)]), frost: bars[0].parts.slice(0, 8).map(p => [p.e.t, +p.x.toFixed(1), +p.vx.toFixed(1), +p.age.toFixed(2)]), fillW: settings.W * bars[0].elapsed / bars[0].dur });
	let last = performance.now();
	const tick = now => {
		const dt = Math.min(.05, (now - last) / 1000); last = now;
		for (const b of bars) b.frame(dt);
		requestAnimationFrame(tick);
	};
	requestAnimationFrame(tick);
});
</script>
